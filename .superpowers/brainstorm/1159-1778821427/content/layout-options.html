<h2>整体信息架构 — 哪种导航布局更好？</h2>
<p class="subtitle">考虑手机和电脑都要好用，信息层级清晰</p>

<p style="margin-bottom: 1.5rem; color: var(--text-secondary);">内容分 <strong>8 个一级分类</strong>：职业特性 | 技能 | 制作配方 | 地图 | 食物农耕 | 战斗 | 车辆 | 生存技巧</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>左侧侧边栏 + 主内容</h3>
      <p>电脑上左侧固定导航，手机上缩进汉堡菜单。经典文档站布局，适合深度阅读和浏览</p>
      <div style="margin-top: 0.5rem; background: #1a1a2e; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px;">
        <div style="display: flex;">
          <div style="width: 30%; background: #16213e; border-radius: 4px; padding: 6px; margin-right: 6px;">
            <div style="color: #e94560; font-size: 10px; margin-bottom: 4px;">导航</div>
            <div style="background: #0f3460; border-radius: 2px; padding: 2px 4px; margin-bottom: 2px; color: #eee;">职业特性</div>
            <div style="background: #0f3460; border-radius: 2px; padding: 2px 4px; margin-bottom: 2px; color: #eee;">制作配方</div>
            <div style="background: #0f3460; border-radius: 2px; padding: 2px 4px; margin-bottom: 2px; color: #eee;">地图</div>
          </div>
          <div style="width: 70%; background: #16213e; border-radius: 4px; padding: 6px; color: #ccc;">主内容区 — 表格/图文详情</div>
        </div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>顶部 Tab 标签栏 + 主内容</h3>
      <p>页面顶部水平标签切换分类，内容区域更大。手机上标签可横向滚动</p>
      <div style="margin-top: 0.5rem; background: #1a1a2e; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px;">
        <div style="background: #16213e; border-radius: 4px; padding: 4px; margin-bottom: 4px; display: flex; gap: 3px; color: #ccc;">
          <span style="background: #e94560; border-radius: 2px; padding: 1px 4px; font-size: 9px;">职业</span>
          <span style="background: #0f3460; border-radius: 2px; padding: 1px 4px; font-size: 9px;">技能</span>
          <span style="background: #0f3460; border-radius: 2px; padding: 1px 4px; font-size: 9px;">制作</span>
          <span style="background: #0f3460; border-radius: 2px; padding: 1px 4px; font-size: 9px;">地图</span>
          <span style="background: #0f3460; border-radius: 2px; padding: 1px 4px; font-size: 9px;">食物</span>
        </div>
        <div style="background: #16213e; border-radius: 4px; padding: 8px; color: #ccc;">主内容区 — 全宽展示表格和内容</div>
      </div>
    </div>
  </div>
</div>
